<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Character audio checks</title>
<style>body{max-width:760px;margin:32px auto;padding:0 20px;background:#17251e;color:#f5f1df;font:15px/1.6 system-ui}button,select,input,textarea{font:inherit}button,select{padding:9px 14px;margin:8px 8px 8px 0}textarea{display:block;box-sizing:border-box;width:100%;min-height:110px;padding:12px}label{display:block;margin:12px 0}pre{white-space:pre-wrap}audio{display:block;width:100%;margin:12px 0}</style>
<h1>Character audio checks</h1>
<p>Nonverbal voices, with the same speech synthesis and sound controls as the game. Listening is needed to judge the timbre; the offline checks cover signal level, click-free envelopes, and cancellation.</p>
<label>Character <select id="speaker"><option value="arthur">Arthur</option><option value="ranger">Mara</option><option value="coach">Theo</option><option value="editor">June</option><option value="planner">Alma</option><option value="maker">Eli</option><option value="astronomer">Ida</option></select></label>
<label>Dialogue <textarea id="line">Welcome home. The kettle is on. There is still time to sit together.</textarea></label>
<button id="speak">Speak</button><button id="stop">Stop speaking</button><button id="mute">Mute</button>
<label>Volume <input id="volume" type="range" min="0" max="100" value="60"></label>
<button id="run">Run offline audio checks</button>
<p>Game fixtures reset only the separate <strong>audio-checks</strong> notebook.</p>
<button id="game-arthur">Visit Arthur in game</button><button id="game-mara">Talk to Mara in game</button><button id="game-opening">Replay introduction</button>
<pre id="results">Ready.</pre>
<div id="samples"></div>
<script type="module" src="./audio.ts"></script></html>
